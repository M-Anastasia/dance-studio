default:
  image: node:22
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store
  before_script:
    - corepack enable
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile

stages:
  - check

lint:
  stage: check
  script:
    - pnpm lint

typecheck:
  stage: check
  script:
    - pnpm typecheck